services:
  postgres_uam:
    image: postgres:18.6

    container_name: uam-postgres-prod
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Debe indicar el usuario}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?Debe indicar la base de datos}

    ports:
      - "172.16.3.74:5432:5432"

    volumes:
      - /data/postgresql:/var/lib/postgresql:Z

    secrets:
      - postgres_password

secrets:
  postgres_password:
    file: /etc/uam/secrets/postgres_password